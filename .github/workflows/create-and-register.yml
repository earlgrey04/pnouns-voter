# Nouns 提案 → Snapshot 提案作成 → 読み戻し検算 → 対応表登録 を一体で実行する。
# 確定引き継ぎ方式(第21回監査): 作成した処理が提案 ID をそのまま登録する。
# 自動検知(2026-08-23): 20 分ごとの定期実行で「投票中・未登録・時間内」の提案を検知して
# 1 件だけ作成する(--auto)。手動起動(nouns_id 指定)も引き続き可能。
name: create-and-register
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      nouns_id:
        description: "Nouns 提案番号(空なら自動検知)"
        required: false
      snapshot_id:
        description: "登録のみ: 外部作成済みの Snapshot 提案 ID(0x…64hex)。nouns_id と author も必須"
        required: false
      author:
        description: "登録のみ: その Snapshot 提案の作成者アドレス(検算で照合)"
        required: false
      check_keys:
        description: "true なら鍵の導出と作成資格の確認だけ行う(作成・登録しない)"
        required: false
        default: "false"
      network:
        description: "対象ネットワーク"
        type: choice
        options: ["sepolia", "mainnet"]
        default: "mainnet"
# 同一提案の二重作成を防ぐ(第21回監査): 直列化。
# 2026-10-01: 以前は nouns_id ごとの group で、手動起動(#N 指定)と自動実行が並行しえたため network 単位に統一
concurrency:
  group: create-and-register-${{ github.event.inputs.network || 'mainnet' }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read   # 直前 run のチェックポイント artifact を探して取得する
jobs:
  run:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.network || 'mainnet' }}   # 承認・secret を環境で分離
    steps:
      - uses: actions/checkout@v4
      # 直前 run が残したチェックポイントを復元(再作成でなく登録から再開するため)。
      # 2026-10-01: download-artifact は run-id 無しだと「同じ run」の artifact しか読まず、別 run の
      # チェックポイントが一度も復元されていなかった(#999 で再作成しかけた)。最新の artifact の run を探して指定する。
      # 毎 run が必ず状態(スタンプ + チェックポイント)を保存するので、最新の artifact = 直前 run の状態。
      - name: find checkpoint
        id: ckpt
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: pending-${{ github.event.inputs.network || 'mainnet' }}
        run: |
          set -o pipefail   # 取得に失敗したら run を止める(空の状態で保存して引き継ぎを失わないため)
          # API の並び順は保証されないため全ページを取得して created_at で最新を選ぶ(保持 2 日 ≒ 150 件程度)
          RID=$(gh api --paginate "repos/${{ github.repository }}/actions/artifacts?name=$NAME&per_page=100" \
            --jq '.artifacts[] | select(.expired | not) | "\(.created_at) \(.workflow_run.id)"' | sort | tail -1 | cut -d' ' -f2)
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
          echo "checkpoint artifact: ${RID:-なし}"
      - name: restore checkpoint
        id: restore
        if: steps.ckpt.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: pending-${{ github.event.inputs.network || 'mainnet' }}
          path: deployments
          run-id: ${{ steps.ckpt.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
      - name: create + verify + register
        env:
          NETWORK: ${{ github.event.inputs.network || 'mainnet' }}
          # リハーサル中は earlgreyai.eth。本番移行時に repo variable SNAPSHOT_SPACE を pnounsdao.eth へ
          SNAPSHOT_SPACE: ${{ vars.SNAPSHOT_SPACE || 'earlgreyai.eth' }}
          SEPOLIA_MNEMONIC: ${{ secrets.SEPOLIA_MNEMONIC }}
          SNAPSHOT_BOT_MNEMONIC: ${{ secrets.SNAPSHOT_BOT_MNEMONIC }}
          SNAPSHOT_BOT_PRIVATE_KEY: ${{ secrets.SNAPSHOT_BOT_PRIVATE_KEY }}  # 設定時はこちらを優先(pNouns 保有 bot)
          REGISTRAR_MNEMONIC: ${{ secrets.REGISTRAR_MNEMONIC }}
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event.inputs.check_keys }}" = "true" ]; then
            node scripts/create-and-register.mjs --nouns 1 --check-keys
          elif [ -n "${{ github.event.inputs.snapshot_id }}" ]; then
            node scripts/create-and-register.mjs --nouns "${{ github.event.inputs.nouns_id }}" --register "${{ github.event.inputs.snapshot_id }}" --author "${{ github.event.inputs.author }}"
          elif [ -n "${{ github.event.inputs.nouns_id }}" ]; then
            node scripts/create-and-register.mjs --nouns "${{ github.event.inputs.nouns_id }}"
          else
            node scripts/create-and-register.mjs --auto
          fi
      # 状態を次 run へ引き継ぐ。チェックポイントが無くてもスタンプを必ず保存し、「最新の artifact = 直前 run の状態」を保つ
      # (空の run が保存しないと、登録済みの古いチェックポイントが最新として復元されてしまう)。
      # 復元に失敗した run は保存しない(手元に無い状態で上書きすると引き継ぎが失われる)
      - name: stamp checkpoint
        if: always() && steps.ckpt.outcome == 'success' && steps.restore.outcome != 'failure'
        run: echo "${{ github.run_id }}" > deployments/ckpt-stamp.txt
      - name: save checkpoint
        if: always() && steps.ckpt.outcome == 'success' && steps.restore.outcome != 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pending-${{ github.event.inputs.network || 'mainnet' }}
          path: |
            deployments/ckpt-stamp.txt
            deployments/*-pending-*.json
          if-no-files-found: error
          overwrite: true   # 同じ run の再実行(re-run)で名前が衝突しないように
          retention-days: 2
